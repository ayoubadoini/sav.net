version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sav-network

  api:
    build: .
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SAVDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=true;
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - JwtSettings__Key=your-secret-key-min-32-characters-here-for-jwt
      - JwtSettings__Issuer=SAVApp
      - JwtSettings__Audience=SAVAppUsers
    ports:
      - "7001:443"
      - "5001:80"
    depends_on:
      - sqlserver
    volumes:
      - ~/.aspnet/https:/https:ro
    networks:
      - sav-network

  web:
    build:
      context: ./sav-webui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=https://api:443/api
    depends_on:
      - api
    networks:
      - sav-network

volumes:
  sqlserver_data:

networks:
  sav-network:
    driver: bridge
